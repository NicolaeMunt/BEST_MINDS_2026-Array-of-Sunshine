spring:
  config:
    # Local secrets (bot token). The .env file is gitignored; see .env.example.
    import: optional:file:.env[.properties]

server:
  port: ${PORT:8081}
  error:
    # The demo endpoints answer 409 with a reason the web app shows (e.g. no damp spell for this crop).
    include-message: always

app:
  # Frontend origin(s), comma separated. "*" allows everything (fine for the demo).
  cors-origins: ${FRONTEND_ORIGIN:*}

  # IDs are the parcels' cadastral numbers (fictive for the demo), the same as in
  # backend/data/parcels.geojson; crop is a key of app.crops below.
  parcels:
    - id: 6401512.058
      name: Livada Sud
      crop: orchard
    - id: 6401204.045
      name: Via Nord
      crop: vineyard
    - id: 6401307.102
      name: Câmpul Mare
      crop: wheat
    - id: 6401512.033
      name: Lanul de Porumb
      crop: corn
    - id: 6401307.101
      name: Lotul de Floarea-soarelui
      crop: sunflower

  # Per-crop rules (same crop keys as the backend and the satellite job, which read this section too).
  # Each crop goes through phases on a fixed calendar for the Orhei area: a phase starts on its "from"
  # day (month-day) and lasts until the next one. An early or late year can be 1-2 weeks off.
  # Sources and reasons for every number: imagery/LOGIC.md, section "Reguli pe culturi".
  #
  # phases:   frost-warning-c / frost-critical-c: air temperature thresholds in that phase; left out =
  #           frost does no harm then (dormant, not sown, harvested). frost-advice: replaces the crop's. season: what the satellite expects
  #           (dormant, establishing, growing, maturing, harvested). kc: FAO-56 crop coefficient for the
  #           water balance; left out = no crop to water.
  # disease:  damp air (min-humidity-pct or more, standing in for wet leaves) between from and to. Any one
  #           condition is enough: at least "hours" damp hours in the last "within-hours", with the hourly
  #           temperature between min-temp-c and max-temp-c.
  # dry:      the days when dry, hot air (app.humidity) harms the crop.
  # water:    root depth (FAO-56 table 22, middle of the range) and the share of the soil water the crop can
  #           use without stress (FAO-56 p).
  crops:
    wheat:
      name: grâu
      frost-advice: Verificați spicele peste 2-3 zile; înghețul în această fază poate lăsa spicele fără boabe.
      phases:
        - { from: "01-01", name: iernare, season: dormant }
        - { from: "03-15", name: înfrățire, season: growing, frost-warning-c: -9, frost-critical-c: -11, kc: 0.7 }
        - { from: "04-10", name: alungirea paiului, season: growing, frost-warning-c: -2, frost-critical-c: -4, kc: 0.9 }
        - { from: "05-01", name: burduf, season: growing, frost-warning-c: 0, frost-critical-c: -2, kc: 1.15 }
        - { from: "05-15", name: spicuire și înflorire, season: growing, frost-warning-c: 1, frost-critical-c: -1, kc: 1.15 }
        - { from: "06-05", name: formarea boabelor, season: growing, frost-warning-c: 0, frost-critical-c: -2, kc: 1.15 }
        - { from: "06-20", name: coacere, season: maturing, kc: 0.4 }
        - { from: "07-15", name: după recoltare, season: harvested }
        - { from: "10-01", name: semănat și răsărire, season: establishing }
      disease:
        name: fuzarioza spicului
        from: "05-20"
        to: "06-15"
        min-humidity-pct: 90
        conditions:
          - { hours: 48, within-hours: 168, min-temp-c: 15, max-temp-c: 30 }
        advice: Spicele au stat ude mult timp în înflorire. Verificați lanul și pregătiți tratamentul fungicid.
      dry:
        from: "05-15"
        to: "07-10"
        advice: Risc de șiștăvire a boabelor. Irigați dacă este posibil.
      water: { root-depth-m: 1.65, depletion-fraction: 0.55 }
    corn:
      name: porumb
      frost-advice: Frunzele arse de îngheț cresc la loc; verificați peste câteva zile dacă vârful de creștere e viu.
      phases:
        - { from: "01-01", name: înainte de semănat, season: dormant }
        - { from: "04-20", name: semănat și răsărire, season: establishing, frost-warning-c: 0, frost-critical-c: -2, kc: 0.3 }
        - { from: "06-15", name: creștere, season: growing, frost-warning-c: 0, frost-critical-c: -2, kc: 0.8 }
        - { from: "07-10", name: înflorire și umplerea boabelor, season: growing, frost-warning-c: 0, frost-critical-c: -2, kc: 1.2 }
        - { from: "08-20", name: coacere, season: maturing, frost-warning-c: 0, frost-critical-c: -2, kc: 0.6 }
        - { from: "09-20", name: maturitate, season: maturing }
        - { from: "10-15", name: după recoltare, season: harvested }
      disease:
        name: helmintosporioză
        from: "06-15"
        to: "08-31"
        min-humidity-pct: 90
        conditions:
          - { hours: 6, within-hours: 6, min-temp-c: 18, max-temp-c: 27 }
        advice: Frunzele au stat ude la căldură. Căutați pete lungi, cenușii pe frunzele de jos.
      dry:
        from: "07-10"
        to: "08-31"
        advice: Risc de polenizare slabă și boabe puține pe știulete. Irigați dacă este posibil.
      water: { root-depth-m: 1.35, depletion-fraction: 0.55 }
    sunflower:
      name: floarea-soarelui
      frost-advice: Plantele tinere suportă înghețuri scurte. Verificați cultura dimineața.
      phases:
        - { from: "01-01", name: înainte de semănat, season: dormant }
        - { from: "04-10", name: semănat și răsărire, season: establishing, frost-warning-c: 0, frost-critical-c: -3, kc: 0.35 }
        - { from: "06-10", name: creștere, season: growing, frost-warning-c: 1, frost-critical-c: -1, kc: 0.7 }
        - { from: "07-01", name: buton și înflorire, season: growing, frost-warning-c: 1, frost-critical-c: -1, kc: 1.05 }
        - { from: "07-25", name: umplerea semințelor, season: maturing, frost-warning-c: -2, frost-critical-c: -4, kc: 0.7 }
        - { from: "08-25", name: coacere, season: maturing, kc: 0.35 }
        - { from: "09-10", name: după recoltare, season: harvested }
      disease:
        name: putregai alb
        from: "07-01"
        to: "07-25"
        min-humidity-pct: 90
        conditions:
          - { hours: 48, within-hours: 72, min-temp-c: 10, max-temp-c: 29 }
        advice: Calatidiile au stat ude în înflorire. Verificați spatele calatidiilor pentru pete moi, albe.
      dry:
        from: "07-01"
        to: "08-15"
        advice: Risc de semințe seci în calatidiu. Urmăriți umiditatea solului.
      water: { root-depth-m: 1.15, depletion-fraction: 0.45 }
    orchard:
      name: livadă
      frost-advice: Florile și mugurii sunt în pericol. Pregătiți aspersiunea sau fumigația.
      phases:
        - { from: "01-01", name: repaus, season: dormant }
        - { from: "03-20", name: dezmugurire, season: establishing, frost-warning-c: -3, frost-critical-c: -5, kc: 0.5 }
        - { from: "04-01", name: buton, season: establishing, frost-warning-c: -0.8, frost-critical-c: -2.8, kc: 0.5 }
        - { from: "04-20", name: înflorire și legarea fructelor, season: establishing, frost-warning-c: 2, frost-critical-c: -2, kc: 0.5 }
        - { from: "05-15", name: creșterea fructelor, season: growing, frost-warning-c: 2, frost-critical-c: -2, kc: 1.2 }
        - { from: "08-15", name: coacere și recoltare, season: growing, frost-warning-c: 0, frost-critical-c: -2, kc: 0.95,
            frost-advice: "Merele îngheață pe la -2 °C. Nu culegeți și nu mișcați fructele cât sunt înghețate; așteptați să se dezghețe la amiază." }
        - { from: "11-01", name: repaus, season: dormant }
      disease:
        name: rapăn
        from: "04-01"
        to: "05-31"
        min-humidity-pct: 90
        # Mills table (revised): the colder it is, the longer the leaves must stay wet.
        conditions:
          - { hours: 6, within-hours: 6, min-temp-c: 16, max-temp-c: 24 }
          - { hours: 12, within-hours: 12, min-temp-c: 9, max-temp-c: 24 }
          - { hours: 15, within-hours: 15, min-temp-c: 7, max-temp-c: 24 }
          - { hours: 28, within-hours: 28, min-temp-c: 4, max-temp-c: 24 }
        advice: Frunzele au stat ude destul cât să prindă rapănul. Pregătiți tratamentul fungicid.
      dry:
        from: "06-01"
        to: "08-31"
        advice: Risc de stres hidric și cădere a fructelor. Irigați livada.
      water: { root-depth-m: 1.5, depletion-fraction: 0.5 }
    vineyard:
      name: viță-de-vie
      frost-advice: Lăstarii tineri sunt în pericol. Pregătiți fumigația sau aspersiunea.
      phases:
        - { from: "01-01", name: repaus, season: dormant }
        - { from: "04-20", name: dezmugurire și lăstari tineri, season: establishing, frost-warning-c: 2, frost-critical-c: -1, kc: 0.3 }
        - { from: "05-20", name: creșterea lăstarilor și înflorire, season: growing, frost-warning-c: 2, frost-critical-c: -1, kc: 0.7 }
        - { from: "08-01", name: coacerea strugurilor și recoltare, season: growing, frost-warning-c: 0, frost-critical-c: -2, kc: 0.45,
            frost-advice: "Înghețul arde frunzele și oprește coacerea. Dacă boabele au înghețat, culegeți strugurii cât mai repede." }
        - { from: "10-20", name: după recoltare, season: harvested }
        - { from: "11-15", name: repaus, season: dormant }
      disease:
        name: mană
        from: "05-15"
        to: "08-31"
        min-humidity-pct: 95
        conditions:
          - { hours: 4, within-hours: 4, min-temp-c: 13, max-temp-c: 29 }
        advice: Noaptea a fost caldă și foarte umedă. Verificați fața de jos a frunzelor și pregătiți tratamentul.
      dry:
        from: "06-01"
        to: "08-31"
        advice: Risc de stres hidric și arsuri pe frunze. Irigați plantațiile tinere.
      water: { root-depth-m: 1.5, depletion-fraction: 0.45 }

  simulator:
    interval-seconds: 5
    # How long the FROST mode takes to reach its target temperature.
    frost-ramp-seconds: 60
    # classpath:... or file:... (timestamp,temperatureC,humidityPct[,precipitationMm])
    replay-file: ${REPLAY_FILE:classpath:replay/sample-frost-night.csv}
    # 1 hour of the CSV is replayed in this many real seconds.
    replay-seconds-per-hour: 10
    # HUMID and DRY replay a real damp or hot, dry spell of 2026 for the parcel's crop ({mode} is
    # humid or dry, {crop} the crop key). Written by backend/make_sample.py.
    episode-file: classpath:replay/{mode}-{crop}.csv
    episode-seconds-per-hour: 0.5
    max-readings-per-parcel: 720

  frost:
    # WARNING also when less than falling-margin-c above the crop's warning threshold and
    # dropped more than falling-drop-c in the last hour.
    falling-margin-c: 3
    falling-drop-c: 3
    # All-clear when this far above the crop's warning threshold.
    all-clear-margin-c: 1
    # Real time, applies to frost and humidity alerts. Set to e.g. 30 for demos.
    cooldown-seconds: ${FROST_COOLDOWN_SECONDS:1800}

  humidity:
    # Dry, hot air harms the crops in their dry window: "suhovei" in the glossary of the Moldovan
    # weather service (meteo.md) is 30% humidity or less at 25 °C or more (and wind, not measured here).
    dry-max-pct: 30
    dry-min-temp-c: 25
    # A risk lasts this many hours after its conditions were last met (damp hours enough for the disease, or
    # dry, hot air), so one rainy spell or one heat wave is one alert and the farmer has time to act.
    hold-hours: 24

  # Read by the backend's water balance (backend/app/water.py), not by this service.
  water:
    # Water the soil holds for plants per metre of roots: FAO-56 table 19, silt loam (0.27 - 0.10 m3/m3).
    soil-water-mm-per-m: 170

  telegram:
    token: ${TELEGRAM_BOT_TOKEN:}
    username: ${TELEGRAM_BOT_USERNAME:}
    # Always receives alerts, even if /start was never sent.
    fallback-chat-id: ${TELEGRAM_CHAT_ID:}
